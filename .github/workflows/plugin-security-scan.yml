name: Plugin Security Scan

on:
  push:
    branches: [main]
  pull_request:

# The scanner only reads the repository; nothing here needs write access.
permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      # Both actions are pinned to full commit SHAs so a moved tag cannot
      # change the code this workflow runs.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashgraph-online/ai-plugin-scanner-action@a4705d710505d3e8f6d639b683a0c87dd31ce598 # v1.2.748
        with:
          plugin_dir: "."
          min_score: 80
          fail_on_severity: high
